name: Build Bulgarian Dimitar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: n SHERPA_NDK/setup-android-ndk@v1
        continue-on-error: true

      - name: Build Native C++ Libraries
        run: |
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          export SHERPA_ONNX_ENABLE_C_API=ON
          bash build-android-arm64-v8a.sh
          
          mkdir -p android/SherpaOnnxTtsEngine/app/src/main/jniLibs/arm64-v8a/
          cp -v ./build-android-arm64-v8a/install/lib/*.so android/SherpaOnnxTtsEngine/app/src/main/jniLibs/arm64-v8a/

      - name: Download Dimitar Voice Model
        run: |
          mkdir -p android/SherpaOnnxTtsEngine/app/src/main/assets/
          curl -L -o android/SherpaOnnxTtsEngine/app/src/main/assets/bg_BG-dimitar-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/bg/bg_BG/dimitar/medium/bg_BG-dimitar-medium.onnx
          curl -L -o android/SherpaOnnxTtsEngine/app/src/main/assets/bg_BG-dimitar-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/bg/bg_BG/dimitar/medium/bg_BG-dimitar-medium.onnx.json

      - name: Build ARM64 APK with Gradle
        run: |
          cd android/SherpaOnnxTtsEngine
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SherpaTTS-Bulgarian-Dimitar
          path: android/SherpaOnnxTtsEngine/app/build/outputs/apk/release/*.apk
